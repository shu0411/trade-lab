name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::388795800221:role/trade-lab-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Export CDK outputs
        id: cdk-outputs
        working-directory: infra
        run: |
          echo "api_url=$(jq -r '.TradeLabStack.ApiEndpoint' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(jq -r '.TradeLabStack.FrontendBucket' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(jq -r '.TradeLabStack.DistributionId' cdk-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.cdk-outputs.outputs.api_url }}
        run: npm run build

      - name: Upload frontend to S3
        working-directory: frontend
        run: |
          aws s3 sync dist/ "s3://${{ steps.cdk-outputs.outputs.frontend_bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cdk-outputs.outputs.distribution_id }}" \
            --paths "/*"
