name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 依存関係をインストール
        working-directory: frontend
        run: npm ci
      - name: lint・整形・型チェック・本番ビルド
        working-directory: frontend
        run: npm run lint && npm run format:check && npx tsc --noEmit && npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3
          DEFAULT_REGION: ap-northeast-1
    env:
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localhost:4566
      TABLE_NAME: trade-lab-hypotheses
      IMAGES_BUCKET: trade-lab-charts-local
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.13'
      - name: 依存関係をインストール
        working-directory: backend
        run: uv sync --frozen --dev
      - name: LocalStack の起動を待機
        run: |
          until curl -sf http://localhost:4566/_localstack/health \
            | python3 -c "import sys,json; s=json.load(sys.stdin)['services']; sys.exit(0 if all(s.get(service) in ('available', 'running') for service in ('dynamodb', 's3')) else 1)"; do
            echo "LocalStack の起動を待っています。"
            sleep 2
          done
      - name: LocalStack のリソースを作成
        working-directory: backend
        run: bash scripts/setup-localstack.sh
      - name: バックエンドの単体・統合テスト
        working-directory: backend
        run: uv run pytest tests/ -v

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 依存関係をインストール
        working-directory: infra
        run: npm ci
      - name: インフラの lint・整形・ビルド
        working-directory: infra
        run: npm run lint && npm run format:check && npm run build
