name: Claude Agent - Implement Issue

# 設計フェーズ（ローカルの /design-issue Skill）で仕様書化されたIssueに
# `ready-for-claude` ラベルが付与されたら、GitHub Actions上のClaude Codeが
# 実装してPull Requestを作成する。
# Claudeへの指示（進め方・禁止事項・PR本文フォーマット）は共通Action側にあるため、
# このファイルには実行環境の準備だけを書く。

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'ready-for-claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Claudeが lint / test / typecheck を実行できるよう、事前に依存関係を用意する
      # （Python は test.yml、Node は deploy.yml と揃える）
      # setup-uv は v8 以降 major タグ（@v10 等）が発行されないため、バージョンまで指定する
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: shu0411/.github/actions/implement-issue@main
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional-allowed-tools: "Bash(npm:*),Bash(npx:*),Bash(uv:*)"
