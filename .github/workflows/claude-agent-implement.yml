name: Claude Agent - Implement Issue

# 設計フェーズ（ローカルの /design-issue Skill）で仕様書化されたIssueに
# `ready-for-claude` ラベルが付与されたら、GitHub Actions上のClaude Codeが
# 実装してPull Requestを作成する。
#
# 事前準備・運用ルールは README.md の「チケット駆動開発: claude-code-action」
# および AGENTS.md を参照。

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'ready-for-claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "ready-for-claude"
          base_branch: "main"
          branch_prefix: "claude/issue-"
          # 原因調査用。エラー本文をログに出す。切り分け後は削除する
          show_full_output: true
          prompt: |
            Issue #${{ github.event.issue.number }} を実装してください。

            - AGENTS.md / CLAUDE.md に書かれたこのリポジトリのルールに従うこと
            - Issueの「仕様」「受け入れ条件」「技術設計」「変更対象」
              「テスト計画」を実装前設計として扱うこと
            - Issueのスコープ外のファイルは変更しないこと
            - mainブランチへの直接push、Pull Requestのmerge、デプロイは行わないこと
            - 実装後は AGENTS.md に記載のlint / test / typecheckコマンドを実行し、
              パスすることを確認してからコミットすること
            - 作業ブランチへpushし、"Closes #${{ github.event.issue.number }}" を
              含むPull Requestを作成すること
            - Pull Request本文は CLAUDE.md の「Pull Request本文フォーマット」に
              従うこと（Summary / Implementation / Changed Areas / Verification /
              Notes）
          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
