name: Claude Agent - Implement Issue

# 設計フェーズ（ローカルの /design-issue Skill）で仕様書化されたIssueに
# `ready-for-claude` ラベルが付与されたら、GitHub Actions上のClaude Codeが
# 実装してPull Requestを作成する。
#
# 事前準備・運用ルールは README.md の「チケット駆動開発: claude-code-action」
# および AGENTS.md を参照。

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'ready-for-claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Claudeが lint / test / typecheck を実行できるよう、事前に依存関係を用意する
      # （バージョンは test.yml / deploy.yml に合わせる）
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "ready-for-claude"
          base_branch: "main"
          branch_prefix: "claude/issue-"
          prompt: |
            Issue #${{ github.event.issue.number }} を実装してください。

            - AGENTS.md / CLAUDE.md に書かれたこのリポジトリのルールに従うこと
            - Issueの「仕様」「受け入れ条件」「技術設計」「変更対象」
              「テスト計画」を実装前設計として扱うこと
            - Issueのスコープ外のファイルは変更しないこと
            - mainブランチへの直接push、Pull Requestのmerge、デプロイは行わないこと
            - 実装後は AGENTS.md に記載のlint / test / typecheckコマンドを実行し、
              パスすることを確認してからコミットすること
            - 作業ブランチへpushし、"Closes #${{ github.event.issue.number }}" を
              含むPull Requestを作成すること
            - Pull Request本文は CLAUDE.md の「Pull Request本文フォーマット」に
              従うこと（Summary / Implementation / Changed Areas / Verification /
              Notes）
          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
            --allowedTools "Bash(git:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(cd:*),Bash(cat:*),Bash(npm:*),Bash(npx:*),Bash(uv:*)"
